name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  backend-postgres:
    name: Backend tests and migrations (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shelterhub
          POSTGRES_PASSWORD: shelterhub
          POSTGRES_DB: shelterhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shelterhub -d shelterhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shelterhub:shelterhub@localhost:5432/shelterhub
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply, match the models and roll back
        run: |
          alembic upgrade head
          alembic check
          python -m app.seed --demo
          alembic downgrade base
      - name: Test suite on PostgreSQL
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://shelterhub:shelterhub@localhost:5432/shelterhub

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API and the frontend
        run: |
          for i in $(seq 60); do
            curl -sf http://localhost:8000/health && curl -sf -o /dev/null http://localhost:5173 && exit 0
            sleep 2
          done
          exit 1
      - name: Smoke check against PostgreSQL
        run: docker compose exec -T backend python scripts/smoke_check.py
      - name: Demo data and photo upload
        run: |
          token=$(curl -sf -H 'Content-Type: application/json' \
            -d '{"email":"staff@example.com","password":"password123"}' \
            http://localhost:8000/auth/login | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC"))' > pixel.png
          url=$(curl -sf -H "Authorization: Bearer $token" -F file=@pixel.png \
            http://localhost:8000/animals/1/photo | python3 -c 'import json,sys; print(json.load(sys.stdin)["photo_url"])')
          curl -sf -o served.png "http://localhost:8000$url"
          cmp pixel.png served.png
      - name: Logs
        if: always()
        run: docker compose logs --no-color

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Before compose: its node_modules volume makes Docker create
      # frontend/node_modules as root, and npm ci could not write there anymore.
      - name: Install Playwright and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Start the stack (migrations + demo seed)
        run: docker compose up -d --build
      - name: Wait for the API and the frontend
        run: |
          for i in $(seq 60); do
            curl -sf http://localhost:8000/health && curl -sf -o /dev/null http://localhost:5173 && exit 0
            sleep 2
          done
          exit 1
      - name: Run browser tests
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
